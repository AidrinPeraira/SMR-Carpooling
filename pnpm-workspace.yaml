packages:
  - smr-frontend
  - smr-backend/*
  - smr-shared
  - smr-ui
overrides:
  "@sharemyride/shared": "workspace:*"
  "@sharemyride/ui": "workspace:*"
allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
