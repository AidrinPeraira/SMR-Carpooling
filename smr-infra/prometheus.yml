global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:4000"]

  - job_name: "user-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["user-service:4000"]

  - job_name: "notification-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["notification-service:4000"]

  - job_name: "trip-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["trip-service:4000"]

  - job_name: "payment-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["payment-service:4000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "frontend"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["frontend:3000"]
