apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: smr-ingress
  namespace: smr-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

spec:
  ingressClassName: nginx
  rules:
    - host: api.sharemyride.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
