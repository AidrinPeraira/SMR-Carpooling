apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret

metadata:
  name: api-gateway-infisical
  namespace: smr-prod

spec:
  hostAPI: https://app.infisical.com
  authentication:
    universalAuth:
      secretsScope:
        envSlug: prod
        secretsPath: /api-gateway
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: smr-prod
  managedSecretReference:
    secretName: api-gateway-env
    secretNamespace: smr-prod
