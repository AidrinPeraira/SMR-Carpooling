apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret

metadata:
  name: mcp-service-infisical
  namespace: smr-prod

spec:
  hostAPI: https://app.infisical.com
  authentication:
    universalAuth:
      secretsScope:
        envSlug: prod
        secretsPath: /mcp-service
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: smr-prod
  managedSecretReference:
    secretName: mcp-service-env
    secretNamespace: smr-prod
