apiVersion: apps/v1
kind: Deployment

metadata:
  name: mcp-service
  namespace: smr-prod
  labels:
    app: mcp-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-service
  template:
    metadata:
      labels:
        app: mcp-service
    spec:
      containers:
        - name: mcp-service
          image: aidrinperaira/smr-mcp-service:latest
          ports:
            - containerPort: 4007
          envFrom:
            - secretRef:
                name: mcp-service-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
