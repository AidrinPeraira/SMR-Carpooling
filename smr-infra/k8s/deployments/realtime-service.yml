apiVersion: apps/v1
kind: Deployment

metadata:
  name: realtime-service
  namespace: smr-prod
  labels:
    app: realtime-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtime-service
  template:
    metadata:
      labels:
        app: realtime-service
    spec:
      containers:
        - name: realtime-service
          image: aidrinperaira/smr-realtime-service:latest
          ports:
            - containerPort: 4005
          envFrom:
            - secretRef:
                name: realtime-service-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
