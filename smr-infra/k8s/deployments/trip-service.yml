apiVersion: apps/v1
kind: Deployment

metadata:
  name: trip-service
  namespace: smr-prod
  labels:
    app: trip-service

spec:
  replicas: 2
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - trip-service
              topologyKey: kubernetes.io/hostname
      containers:
        - name: trip-service
          image: aidrinperaira/smr-trip-service:latest
          ports:
            - containerPort: 4003
          envFrom:
            - secretRef:
                name: trip-service-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
