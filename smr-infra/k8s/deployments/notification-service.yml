apiVersion: apps/v1
kind: Deployment

metadata:
  name: notification-service
  namespace: smr-prod
  labels:
    app: notification-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: aidrinperaira/smr-notification-service:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: notification-service-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
