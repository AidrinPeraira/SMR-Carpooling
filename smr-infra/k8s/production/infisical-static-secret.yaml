apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: infisical-static-secret-demo
  namespace: default
spec:
  infisicalAuthRef:
    name: infisical-auth
    namespace: default
  syncOptions:
    refreshInterval: 1m
    instantUpdates: false
  sources:
    - projectSlug: share-my-ride-nw-ga
      environmentSlug: prod
      secretPath: "/"
  targets:
    - name: managed-secret
      namespace: default
      kind: Secret
      creationPolicy: Owner
