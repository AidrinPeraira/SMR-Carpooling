apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smr-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  # This is where we set up the dns domain name for
  # the backend services.
  # host: api.smr.aidrinperaira.com
  #
  # All traffic routes through the API gateway.
  # The gateway proxies /socket.io to the realtime service with ws: true.
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smr-api-gateway-service
                port:
                  number: 80
