services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: smr-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./smr-backend/api-gateway/.env
    environment:
      - NODE_ENV=production

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: smr-user-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - ./smr-backend/user-service/.env
    environment:
      - NODE_ENV=production

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: smr-notification-service
    restart: unless-stopped
