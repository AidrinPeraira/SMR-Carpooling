      - NODE_ENV=production

  realtime-service:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: smr-realtime-service
    restart: unless-stopped
    ports:
      - "4005:4005"
    env_file:
      - ./smr-backend/realtime-service/.env
    environment:
      - NODE_ENV=production

  mcp-service:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: smr-mcp-service
    restart: unless-stopped
    ports:
      - "4007:4007"
    env_file:
      - ./smr-backend/mcp-service/.env
    environment:
      - NODE_ENV=production
