services:
  # --- Infrastructure ---
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_LOG_LEVEL=warning

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./smr-infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3101:3000"
    volumes:
      - ./smr-infra/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana
    environment:
      - GF_LOG_LEVEL=warn

  loki:
    image: grafana/loki:latest
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./smr-infra/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml -log.level=warn

  promtail:
    image: grafana/promtail:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./smr-infra/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml -log.level=warn

  # --- Backend Services ---
  api-gateway:
    build:
      context: .
      dockerfile: smr-backend/api-gateway/Dockerfile.prod
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      - rabbitmq
      - redis

  user-service:
    build:
      context: .
      dockerfile: smr-backend/user-service/Dockerfile.prod
    restart: always
    ports:
      - "4001:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      - rabbitmq
      - redis

  notification-service:
    build:
      context: .
      dockerfile: smr-backend/notification-service/Dockerfile.prod
    restart: always
    ports:
      - "4002:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      - rabbitmq
      - redis

  trip-service:
    build:
      context: .
      dockerfile: smr-backend/trip-service/Dockerfile.prod
    restart: always
    ports:
      - "4003:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      - rabbitmq
      - redis

  payment-service:
    build:
      context: .
      dockerfile: smr-backend/payment-service/Dockerfile.prod
    restart: always
    ports:
      - "4004:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      - rabbitmq
      - redis

  # --- Frontend Service ---
  frontend:
    build:
      context: .
      dockerfile: smr-frontend/Dockerfile.prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - api-gateway

volumes:
  rabbitmq_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
