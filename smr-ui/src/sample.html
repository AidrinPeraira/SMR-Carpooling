<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>smr-ui Component Blueprint Matrix</title>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <style>
      /* Absolute raw token injection binding native CSS variables to UI wrappers */
      :root {
        /* --- Surfaces (Backgrounds) --- */
        --color-surface-base: oklch(0.99 0.003 153.26);      /* Main app bg */
        --color-surface-sidebar: oklch(0.9687 0.0041 153.26); 
        --color-surface-card: oklch(1 0 0);
        --color-surface-muted: oklch(0.9687 0.006 153.26);    /* Was action-muted */

        /* --- Borders --- */
        --color-border-subtle: oklch(0.9334 0.005 256.34);
        --color-border-strong: oklch(0.9189 0.008 142.1);

        /* --- Brand / Accents --- */
        --color-accent: oklch(0.7468 0.1785 153);            /* Your primary brand color */
        --color-accent-fg: oklch(0.2001 0.012 126.61);       /* Text/Icons on top of accent */

        /* --- Content (Typography & Icons) --- */
        --color-content-primary: oklch(0.2001 0.012 126.61);
        --color-content-secondary: oklch(0.5956 0.0185 143.43);
        --color-content-tertiary: oklch(0.72 0.012 143.43);

        /* --- Status / Intent Layers --- */
        --color-error-surface: oklch(0.97 0.015 15);
        --color-error-border: oklch(0.88 0.08 15);
        --color-error-content: oklch(0.55 0.18 15);

        --color-warning-surface: oklch(0.97 0.02 80);
        --color-warning-border: oklch(0.91 0.07 80);
        --color-warning-content: oklch(0.52 0.13 60);

        --color-success-surface: oklch(0.98 0.015 145);
        --color-success-border: oklch(0.91 0.04 145);
        --color-success-content: oklch(0.53 0.16 145);
      }

      .dark-workspace {
        /* --- Surfaces (Backgrounds) --- */
        --color-surface-base: oklch(0.1201 0.012 126.61);
        --color-surface-sidebar: oklch(0.1601 0.012 126.61);
        --color-surface-card: oklch(0.2001 0.012 126.61);
        --color-surface-muted: oklch(0.22 0.012 126.61);

        /* --- Borders --- */
        --color-border-subtle: oklch(0.28 0.01 126.61);
        --color-border-strong: oklch(0.35 0.015 142.1);

        /* --- Brand / Accents --- */
        --color-accent: oklch(0.7 0.165 153);
        --color-accent-fg: oklch(0.1201 0.012 126.61);

        /* --- Content (Typography & Icons) --- */
        --color-content-primary: oklch(0.9687 0.006 153.26);
        --color-content-secondary: oklch(0.68 0.015 143.43);
        --color-content-tertiary: oklch(0.45 0.01 143.43);

        /* --- Status / Intent Layers --- */
        --color-error-surface: oklch(0.25 0.08 15);
        --color-error-border: oklch(0.32 0.09 15);
        --color-error-content: oklch(0.82 0.07 15);

        --color-warning-surface: oklch(0.26 0.07 65);
        --color-warning-border: oklch(0.34 0.08 65);
        --color-warning-content: oklch(0.85 0.06 75);

        --color-success-surface: oklch(0.22 0.05 145);
        --color-success-border: oklch(0.29 0.06 145);
        --color-success-content: oklch(0.81 0.08 145);
      }

      body {
        background-color: #0b0f19;
        color: #f3f4f6;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
    </style>
  </head>
  <body class="p-6">
    <header class="mb-12 border-b border-gray-800 pb-6">
      <h1 class="text-3xl font-bold tracking-tight text-white mb-2">
        smr-ui Blueprint Matrix
      </h1>
      <p class="text-gray-400 max-w-3xl">
        Live rendering using exact architectural tokens. Core Green Theme (<span
          class="text-[#1cc994] font-semibold"
          >#1cc994</span
        >) and structured layout intents analyzed side-by-side.
      </p>
    </header>

    <main class="grid grid-cols-1 xl:grid-cols-2 gap-8">
      <section
        class="rounded-xl p-8 border border-gray-200 shadow-xl"
        style="background-color: var(--color-surface-base); color: var(--color-content-primary);"
      >
        <div
          class="flex items-center justify-between mb-8 pb-4 border-b"
          style="border-color: var(--color-border-strong);"
        >
          <h2 class="text-xl font-bold" style="color: var(--color-content-primary);">
            Light Architecture Mode
          </h2>
          <span
            class="px-2.5 py-1 text-xs font-semibold rounded-full"
            style="background-color: var(--color-surface-muted); color: var(--color-content-secondary);"
            >Default Standard</span
          >
        </div>
        <div id="light-content-target" class="space-y-12"></div>
      </section>

      <section
        class="dark-workspace rounded-xl p-8 border border-gray-800 shadow-xl"
        style="background-color: var(--color-surface-base); color: var(--color-content-primary);"
      >
        <div
          class="flex items-center justify-between mb-8 pb-4 border-b"
          style="border-color: var(--color-border-strong);"
        >
          <h2 class="text-xl font-bold" style="color: var(--color-content-primary);">
            Dark Architecture Mode
          </h2>
          <span
            class="px-2.5 py-1 text-xs font-semibold rounded-full"
            style="background-color: var(--color-surface-muted); color: var(--color-content-secondary);"
            >Double Distance Contrast</span
          >
        </div>
        <div id="dark-content-target" class="space-y-12"></div>
      </section>
    </main>

    <template id="ui-blueprint">
      <section class="mb-10">
        <h3
          class="text-xs font-bold border-b pb-2 mb-6 uppercase tracking-widest"
          style="border-color: var(--color-border-strong); color: var(--color-content-secondary);"
        >
          1. Actions
        </h3>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">
            Button.tsx
          </h4>
          <div class="flex flex-wrap gap-4">
            <button
              class="px-4 py-2 text-sm font-semibold rounded shadow-sm hover:opacity-90 transition-all cursor-pointer"
              style="background-color: var(--color-accent); color: var(--color-accent-fg);"
            >
              Primary Action
            </button>
            <button
              class="px-4 py-2 text-sm font-medium rounded border hover:opacity-80 transition-all cursor-pointer"
              style="border-color: var(--color-border-strong); background-color: var(--color-surface-muted); color: var(--color-content-primary);"
            >
              Secondary Action
            </button>
            <button
              class="px-4 py-2 text-sm font-medium rounded hover:opacity-80 transition-all cursor-pointer"
              style="color: var(--color-content-secondary); --tw-bg-opacity: 0.1;"
              onmouseover="this.style.backgroundColor='var(--color-surface-muted)'"
              onmouseout="this.style.backgroundColor='transparent'"
            >
              Ghost Link
            </button>
            <button
              class="px-4 py-2 text-sm font-semibold rounded shadow-sm border hover:opacity-90 transition-all cursor-pointer"
              style="background-color: var(--color-error-surface); border-color: var(--color-error-border); color: var(--color-error-content);"
            >
              Danger Action
            </button>
          </div>
        </div>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">
            IconButton.tsx
          </h4>
          <div class="flex gap-4">
            <button
              class="p-2.5 rounded-full flex items-center justify-center cursor-pointer shadow-sm"
              style="background-color: var(--color-accent); color: var(--color-accent-fg);"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <path d="M12 4v16m8-8H4" />
              </svg>
            </button>
            <button
              class="p-2.5 rounded-lg border flex items-center justify-center cursor-pointer"
              style="border-color: var(--color-border-subtle); background-color: var(--color-surface-muted); color: var(--color-content-primary);"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                />
                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <section class="mb-10">
        <h3
          class="text-xs font-bold border-b pb-2 mb-6 uppercase tracking-widest"
          style="border-color: var(--color-border-strong); color: var(--color-content-secondary);"
        >
          2. Data Display
        </h3>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">
            Avatar.tsx & Badge.tsx
          </h4>
          <div class="flex gap-6 items-center">
            <div class="relative inline-block">
              <div
                class="w-11 h-11 rounded-full border flex items-center justify-center font-bold text-sm"
                style="border-color: var(--color-border-strong); background-color: var(--color-surface-muted);"
              >
                AP
              </div>
              <span
                class="absolute bottom-0 right-0 block h-3 w-3 rounded-full ring-2 ring-offset-0"
                style="background-color: var(--color-accent);"
              ></span>
            </div>
            <span
              class="px-2.5 py-0.5 text-xs font-bold rounded-full"
              style="background-color: var(--color-accent); color: var(--color-accent-fg);"
              >12 Unresolved Nodes</span
            >
          </div>
        </div>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">Card.tsx</h4>
          <div
            class="max-w-xs rounded-lg border p-5 shadow-sm"
            style="border-color: var(--color-border-strong); background-color: var(--color-surface-card);"
          >
            <span
              class="text-[10px] uppercase font-bold tracking-wider"
              style="color: var(--color-content-secondary);"
              >Domain Layout Layer</span
            >
            <h5 class="text-sm font-bold mt-1 mb-1.5" style="color: var(--color-content-primary);">
              Modular Monolith Matrix
            </h5>
            <p class="text-xs mb-4 leading-relaxed" style="color: var(--color-content-secondary);">
              Encapsulates bounded data context elements smoothly without
              architectural leaking thresholds.
            </p>
            <div
              class="w-full h-1.5 rounded-full overflow-hidden"
              style="background-color: var(--color-surface-muted);"
            >
              <div class="h-full w-2/3" style="background-color: var(--color-accent);"></div>
            </div>
          </div>
        </div>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">Table.tsx</h4>
          <div class="overflow-hidden rounded-lg border" style="border-color: var(--color-border-subtle);">
            <table class="w-full text-left text-xs border-collapse">
              <thead>
                <tr
                  class="border-b font-semibold"
                  style="background-color: var(--color-surface-sidebar); border-color: var(--color-border-strong); color: var(--color-content-secondary);"
                >
                  <th class="p-2.5">Domain Context</th>
                  <th class="p-2.5 text-right">Compilation</th>
                </tr>
              </thead>
              <tbody>
                <tr
                  class="border-b transition-colors"
                  style="border-color: var(--color-border-subtle);"
                  onmouseover="this.style.backgroundColor='var(--color-surface-muted)'"
                  onmouseout="this.style.backgroundColor='transparent'"
                >
                  <td class="p-2.5 font-medium">Nexus Application Pipeline</td>
                  <td
                    class="p-2.5 text-right font-semibold"
                    style="color: var(--color-content-secondary);"
                  >
                    Bound
                  </td>
                </tr>
                <tr 
                  class="transition-colors"
                  onmouseover="this.style.backgroundColor='var(--color-surface-muted)'"
                  onmouseout="this.style.backgroundColor='transparent'"
                >
                  <td class="p-2.5 font-medium">CoReader Sandbox Asset</td>
                  <td
                    class="p-2.5 text-right font-semibold"
                    style="color: var(--color-content-secondary);"
                  >
                    Staged
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">Tag.tsx</h4>
          <div class="flex gap-2">
            <span
              class="px-2 py-0.5 rounded text-[11px] font-medium border"
              style="border-color: var(--color-border-strong); background-color: var(--color-surface-muted); color: var(--color-content-primary);"
              >TypeScript Node</span
            >
            <span
              class="px-2 py-0.5 rounded text-[11px] font-medium"
              style="background-color: var(--color-accent); color: var(--color-accent-fg);"
              >Clean Architecture</span
            >
          </div>
        </div>
      </section>

      <section class="mb-10">
        <h3
          class="text-xs font-bold border-b pb-2 mb-6 uppercase tracking-widest"
          style="border-color: var(--color-border-strong); color: var(--color-content-secondary);"
        >
          3. System Feedback
        </h3>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">Alert.tsx</h4>
          <div
            class="p-3.5 rounded-md border flex gap-3 items-start"
            style="border-color: var(--color-border-strong); background-color: var(--color-surface-sidebar);"
          >
            <div
              class="w-2 h-2 mt-1.5 rounded-full shrink-0"
              style="background-color: var(--color-accent);"
            ></div>
            <div>
              <h5 class="text-xs font-bold" style="color: var(--color-content-primary);">
                Domain Context Re-indexed
              </h5>
              <p class="text-[11px] mt-0.5" style="color: var(--color-content-secondary);">
                Parameters processed cleanly inside local thread instances.
              </p>
            </div>
          </div>
        </div>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">
            Dialog.tsx (Inline Preview)
          </h4>
          <div
            class="rounded-lg border shadow-md overflow-hidden max-w-sm"
            style="border-color: var(--color-border-strong); background-color: var(--color-surface-card);"
          >
            <div class="p-4">
              <h5 class="text-xs font-bold mb-1" style="color: var(--color-content-primary);">
                Confirm Database Schema Update?
              </h5>
              <p class="text-[11px] leading-relaxed" style="color: var(--color-content-secondary);">
                This setup pushes local schema mapping matrices cleanly onto the
                central database instances cluster.
              </p>
            </div>
            <div
              class="px-4 py-2.5 border-t flex justify-end gap-2"
              style="background-color: var(--color-surface-sidebar); border-color: var(--color-border-subtle);"
            >
              <button
                class="px-2.5 py-1 text-[11px] font-medium rounded cursor-pointer"
                style="background-color: var(--color-surface-muted); color: var(--color-content-secondary);"
              >
                Abort
              </button>
              <button
                class="px-2.5 py-1 text-[11px] font-medium rounded cursor-pointer"
                style="background-color: var(--color-accent); color: var(--color-accent-fg);"
              >
                Execute Core
              </button>
            </div>
          </div>
        </div>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">
            Spinner.tsx
          </h4>
          <div class="flex items-center gap-2.5 text-xs" style="color: var(--color-content-secondary);">
            <div
              class="w-4 h-4 border-2 rounded-full animate-spin"
              style="border-color: var(--color-border-strong); border-top-color: var(--color-accent);"
            ></div>
            <span>Compiling container cluster dependencies...</span>
          </div>
        </div>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">
            Toast.tsx (Saturated Intent Variants)
          </h4>
          <div class="space-y-3 max-w-sm">
            <div
              class="flex items-center justify-between p-3 rounded border shadow-sm"
              style="
                background-color: var(--color-success-surface);
                border-color: var(--color-success-border);
              "
            >
              <div class="flex items-center gap-2.5">
                <span
                  class="w-1.5 h-1.5 rounded-full"
                  style="background-color: var(--color-success-content)"
                ></span>
                <span
                  class="text-xs font-semibold"
                  style="color: var(--color-success-content)"
                  >Success: Synchronization pipeline complete</span
                >
              </div>
              <span
                class="text-[10px] uppercase font-bold opacity-60 cursor-pointer"
                style="color: var(--color-success-content)"
                >Dismiss</span
              >
            </div>

            <div
              class="flex items-center justify-between p-3 rounded border shadow-sm"
              style="
                background-color: var(--color-warning-surface);
                border-color: var(--color-warning-border);
              "
            >
              <div class="flex items-center gap-2.5">
                <span
                  class="w-1.5 h-1.5 rounded-full"
                  style="background-color: var(--color-warning-content)"
                ></span>
                <span
                  class="text-xs font-semibold"
                  style="color: var(--color-warning-content)"
                  >Warning: High memory thread consumption</span
                >
              </div>
              <span
                class="text-[10px] uppercase font-bold opacity-60 cursor-pointer"
                style="color: var(--color-warning-content)"
                >Review</span
              >
            </div>

            <div
              class="flex items-center justify-between p-3 rounded border shadow-sm"
              style="
                background-color: var(--color-error-surface);
                border-color: var(--color-error-border);
              "
            >
              <div class="flex items-center gap-2.5">
                <span
                  class="w-1.5 h-1.5 rounded-full"
                  style="background-color: var(--color-error-content)"
                ></span>
                <span
                  class="text-xs font-semibold"
                  style="color: var(--color-error-content)"
                  >Error: Migration execution faulted</span
                >
              </div>
              <span
                class="text-[10px] uppercase font-bold opacity-60 cursor-pointer"
                style="color: var(--color-error-content)"
                >Retry</span
              >
            </div>
          </div>
        </div>
      </section>

      <section class="mb-10">
        <h3
          class="text-xs font-bold border-b pb-2 mb-6 uppercase tracking-widest"
          style="border-color: var(--color-border-strong); color: var(--color-content-secondary);"
        >
          4. Forms & Inputs
        </h3>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">
            Label.tsx
          </h4>
          <div class="space-y-4 max-w-xs">
            <div>
              <label
                for="blueprint-email"
                class="block text-[10px] uppercase font-bold tracking-wider mb-1"
                style="color: var(--color-content-secondary);"
              >
                Account Email
              </label>
              <input
                id="blueprint-email"
                type="email"
                placeholder="name@example.com"
                class="w-full px-3 py-1.5 text-xs rounded border focus:outline-none"
                style="border-color: var(--color-border-strong); background-color: var(--color-surface-card); color: var(--color-content-primary);"
              />
            </div>
          </div>
        </div>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">
            Input.tsx & Checkbox.tsx
          </h4>
          <div class="space-y-4 max-w-xs">
            <div>
              <label
                class="block text-[10px] uppercase font-bold tracking-wider mb-1"
                style="color: var(--color-content-secondary);"
                >Prisma Schema Working Root</label
              >
              <input
                type="text"
                value="~/dev/nexus/prisma"
                readonly
                class="w-full px-3 py-1.5 text-xs rounded border focus:outline-none"
                style="border-color: var(--color-border-strong); background-color: var(--color-surface-card); color: var(--color-content-primary);"
              />
            </div>
            <label
              class="flex items-center gap-2 text-xs font-medium cursor-pointer"
              style="color: var(--color-content-primary);"
            >
              <input
                type="checkbox"
                checked
                class="w-3.5 h-3.5 rounded border-strong bg-surface accent-[var(--color-accent)]"
              />
              <span>Enable modular structure encapsulation maps</span>
            </label>
          </div>
        </div>

        <div class="border-b pb-6 mb-6" style="border-color: var(--color-border-subtle);">
          <h4 class="text-xs font-mono mb-3" style="color: var(--color-content-secondary);">
            Search.tsx
          </h4>
          <div class="relative max-w-xs">
            <input
              type="text"
              placeholder="Search parameters..."
              class="w-full pl-3 pr-8 py-1.5 text-xs rounded border focus:outline-none"
              style="border-color: var(--color-border-strong); background-color: var(--color-surface-card); color: var(--color-content-primary);"
            />
            <span class="absolute right-2.5 top-2" style="color: var(--color-content-tertiary);">
              <svg
