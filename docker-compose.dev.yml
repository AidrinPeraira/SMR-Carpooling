services:

  shared-builder: 
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: shared-backend-build
    volumes: 
      - .:/app
      - /app/node_modules
      - /app/smr-shared/node_modules
    command: pnpm --filter @smr/shared run dev
    develop: 
      watch: 
        - action: sync
          path: ./smr-shared/src
          target: /app/smr-shared/src

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: user-service
    ports:
      - "4001:4001"
    env_file:
      - ./smr-backend/user-service/.env
    environment:
      - NODE_ENV=development
      - CI=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/smr-backend/user-service/node_modules
      - /app/smr-shared/node_modules
    develop:
      watch:
        - action: sync
          path: ./smr-backend/user-service/src
          target: /app/smr-backend/user-service/src
        - action: rebuild
          path: package.json
        - action: rebuild
          path: ./smr-backend/user-service/package.json
        - action: sync
          path: ./smr-shared/dist
          target: /app/smr-shared/dist
 
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: api-gateway
    ports:
      - "4000:4000"
    env_file:
