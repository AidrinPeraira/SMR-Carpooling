services:
  # --- Infrastructure ---
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_LOG_LEVEL=warning

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./smr-infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3101:3000"
    volumes:
      - ./smr-infra/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_LOG_LEVEL=warn

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./smr-infra/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml -log.level=warn

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./smr-infra/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml -log.level=warn

  # --- Backend Services ---
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @smr/api-gateway dev
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - rabbitmq
      - redis

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @smr/user-service dev
    ports:
      - "4001:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - rabbitmq
      - redis

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @smr/notification-service dev
    ports:
      - "4002:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - rabbitmq
      - redis

  trip-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @smr/trip-service dev
    ports:
      - "4003:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - rabbitmq
      - redis

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @smr/payment-service dev
    ports:
      - "4004:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - rabbitmq
      - redis

  # --- Frontend Service ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @smr/frontend dev
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true # Critical for hot reload in Docker
    volumes:
      - .:/app
      - /app/node_modules
      - /app/smr-frontend/.next
    depends_on:
      - api-gateway

volumes:
  rabbitmq_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
