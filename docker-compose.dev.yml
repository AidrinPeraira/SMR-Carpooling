      - /app/node_modules
      - /app/smr-backend/api-gateway/node_modules
      - /app/smr-shared/node_modules
    develop:
      watch:
        - action: sync
          path: ./smr-backend/api-gateway/src
          target: /app/smr-backend/api-gateway/src
        - action: rebuild
          path: package.json
        - action: rebuild
          path: ./smr-backend/api-gateway/package.json
        - action: sync
          path: ./smr-shared/dist
          target: /app/smr-shared/dist

