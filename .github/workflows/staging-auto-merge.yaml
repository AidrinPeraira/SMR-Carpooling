name: Staging Auto Merge

on:
  workflow_run:
    workflows: [Staging Merge Check]
    types:
      - completed

jobs:
  auto-merge:
    if: ${{ github.event.workflow_run.conclusion == "success" }}

    runs-on: ubuntu-latest

    steps:
      - name: Merge PR
        run: gh pr merge ${{github.event.workflow_run.pull_requests[0].number}}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
