name: Develop Merge Check

on:
  pull_request:
    branches: ["develop"]

jobs:
  lint-check:
    name: Lint Error Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install pnpm
        run: npm i -g pnpm@11.0.8

      - name: Install packages
        run: pnpm install

      - name: Build Shared Packages
        run: pnpm -F @sharemyride/shared -F @sharemyride/ui run build

      - name: Generate Prisma Files
        run: pnpm -F @smr/trip-service run prisma:generate

      - name: Check lint errors
        run: pnpm lint

  type-check:
    name: Type Error Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install pnpm
        run: npm i -g pnpm@11.0.8

      - name: Install packages
        run: pnpm install

      - name: Build Shared Packages
        run: pnpm -F @sharemyride/shared -F @sharemyride/ui run build

      - name: Generate Prisma Files
        run: pnpm -F @smr/trip-service run prisma:generate

      - name: Check type errors
        run: pnpm run type-check

  test-suite-check:
    name: Test Suite Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install pnpm
        run: npm i -g pnpm@11.0.8

      - name: Install packages
        run: pnpm install

      - name: Build Shared Packages
        run: pnpm -F @sharemyride/shared -F @sharemyride/ui run build

      - name: Run Tests
        run: pnpm test

  frontend-build-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install pnpm
        run: npm i -g pnpm@11.0.8

      - name: Install packages
        run: pnpm install

      - name: Build Shared Packages
        run: pnpm -F @sharemyride/shared -F @sharemyride/ui run build

      - name: Run Tests
        run: pnpm -F @smr/frontend run build

  docker-dev-build-check:
    name: Docker Dev Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Enable pnpm
        run: npm i -g pnpm@11.0.8

      - name: Check Docker Dev Build
        run: pnpm run docker:dev:build
