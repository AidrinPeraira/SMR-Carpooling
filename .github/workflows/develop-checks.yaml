name: Develop Merge Check

on:
  pull_request:
    branches: ["develop"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # - name: Use Node.js
      #   uses: actions/setup-node@v7
      #   with:
      #     node-version: "24.x"
      #
      # - name: Install pnpm
      #   run: npm i -g pnpm@11.0.8

      # we can setup the above with built in pnpm and cache (faster CI)
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install packages
        run: pnpm install

      - name: Build Shared Packages
        run: pnpm -F @sharemyride/shared -F @sharemyride/ui run build

      - name: Check lint errors
        run: pnpm lint

      - name: Check type errors
        run: pnpm run type-check

      - name: Run Tests
        run: pnpm test

      - name: Check Docker Dev Build
        run: pnpm run docker:dev:build
