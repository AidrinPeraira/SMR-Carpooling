name: Deploy to DigitalOcean

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install pnpm
        run: npm i -g pnpm@11.0.8

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3
      #
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3
      #
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # - name: Build and push images
      #   run: pnpm run docker:prod:push

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITAL_OCEAN_SECRET }}

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save sharemyride

      - name: Apply configs
        run: kubectl apply -R -f smr-infra/k8s/production/

      - name: Rollout deployments
        run: |
          kubectl rollout restart deployment/smr-api-gateway-deployment
          kubectl rollout restart deployment/smr-user-service-deployment
          kubectl rollout restart deployment/smr-trip-service-deployment
          kubectl rollout restart deployment/smr-realtime-service-deployment
          kubectl rollout restart deployment/smr-payment-service-deployment
          kubectl rollout restart deployment/smr-notification-service-deployment
          kubectl rollout restart deployment/smr-mcp-service-deployment
