name: Continuous Integration

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: "pnpm"

      - name: Approve build dependencies
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Dependencies
        run: pnpm --filter @sharemyride/shared --filter @sharemyride/ui run build

      - name: Generate Prisma Client for Trip Service
        run: pnpm --filter @smr/trip-service run prisma:generate

      - name: Workspace Lint
        run: pnpm run lint

      - name: Workspace Type Check
        run: pnpm run type-check

  unit-and-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: "pnpm"

      - name: Approve build dependencies
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Dependencies
        run: pnpm --filter @sharemyride/shared --filter @sharemyride/ui run build

      - name: Generate Prisma Client for Trip Service
        run: pnpm --filter @smr/trip-service run prisma:generate

      - name: Run Tests
        run: pnpm run test

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: "pnpm"

      - name: Approve build dependencies
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Docker Images (No Push)
        run: pnpm run docker:build
