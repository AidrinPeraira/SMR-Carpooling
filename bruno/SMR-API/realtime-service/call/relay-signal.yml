      value: Bearer {{ACCESS_TOKEN}}
  message:
    type: json
    data: |-
      {
        "call_session_id": "session_abc123",
        "signal_type": "offer",
        "signal_data": {
          "sdp": "v=0\r\no=- 123456 2 IN IP4 127.0.0.1..."
        }
      }

settings:
  timeout: 0
  keepAliveInterval: 0
