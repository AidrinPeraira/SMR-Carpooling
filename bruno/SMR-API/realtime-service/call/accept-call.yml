info:
  name: accept-call
  type: websocket
  seq: 2

websocket:
  url: ws://localhost:4005/call
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  message:
    type: json
    data: |-
      {
        "call_session_id": "session_abc123"
      }

settings:
  timeout: 0
  keepAliveInterval: 0
