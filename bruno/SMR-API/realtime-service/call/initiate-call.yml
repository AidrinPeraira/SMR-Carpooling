info:
  name: initiate-call
  type: websocket
  seq: 1

websocket:
  url: ws://localhost:4005/call
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  message:
    type: json
    data: |-
      {
        "trip_id": "trip_abc123",
        "receiver_id": "user_xyz789"
      }

settings:
  timeout: 0
  keepAliveInterval: 0
