info:
  name: send-message
  type: websocket
  seq: 4

websocket:
  url: ws://localhost:4005/chat
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  message:
    type: json
    data: |-
      {
        "chat_id": "chat_xyz789",
        "body": "Hello everyone!"
      }

settings:
  timeout: 0
  keepAliveInterval: 0
