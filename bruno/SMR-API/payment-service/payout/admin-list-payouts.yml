info:
  name: admin-list-payouts
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:4000/v1/payouts/admin?page=1&limit=10
  headers:
    - name: Content-Type
      value: application/json
    - name: x-gateway-key
      value: smr_gateway_u4v9fPrcueOb7dvkezvUadzTCZWs1wKe
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: filterField
      value: status
      type: query
      enabled: false
    - name: filterValue
      value: pending
      type: query
      enabled: false
    - name: sortField
      value: createdAt
      type: query
      enabled: false
    - name: sortValue
      value: desc
      type: query
      enabled: false
