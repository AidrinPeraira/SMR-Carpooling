docs: |
  ## Admin — List All Payouts

  Returns a paginated list of all payout records for admin review and approval.
  Supports filtering by status, driver, and sorting.

  ### Query Parameters

  | Parameter    | Type   | Required | Description                                    |
  |--------------|--------|----------|------------------------------------------------|
  | `page`       | number | No       | Page number (default: 1)                       |
  | `limit`      | number | No       | Items per page (default: 10)                   |
  | `filterField`| string | No       | Field to filter on (`status`, `driverId`, etc) |
  | `filterValue`| string | No       | Exact match value (e.g. `pending`)             |
  | `sortField`  | string | No       | Field to sort by (e.g. `createdAt`, `amount`)  |
  | `sortValue`  | string | No       | Sort direction: `asc` or `desc`                |

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
