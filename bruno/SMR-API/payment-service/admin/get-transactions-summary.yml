  ## Admin — Get Transactions Summary

  Returns aggregated financial summary for the admin dashboard.

  ### Response Shape (success)

  ```json
  {
    "success": true,
    "message": "Operation completed successfully.",
    "payload": {
      "total_revenue": 50000,
      "booking_revenue": 45000,
      "payouts_issued": 30000,
      "refunds_issued": 5000
    }
  }
  ```

