docs: |
  ## Admin — Get Revenue Trend

  Returns revenue trend data grouped by the selected time range.

  ### Query Parameters

  | Parameter | Type   | Required | Description                                            |
  |-----------|--------|----------|--------------------------------------------------------|
  | `range`   | string | No       | `last_week`, `last_month` (default), or `last_year`    |

  ### Response Shape (success)

  ```json
  {
    "success": true,
    "message": "Operation completed successfully.",
    "payload": {
      "trend_range": "last_month",
      "data": [
        { "label": "W1", "value": 12000 },
        { "label": "W2", "value": 15000 },
        { "label": "W3", "value": 11000 },
        { "label": "W4", "value": 18000 }
      ]
    }
  }
  ```

