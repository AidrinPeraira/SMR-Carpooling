info:
  name: login-user
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:4000/api/v1/auth/login
  body:
    type: json
    data: |2-
        {
          
          "email_id": "timox75115@kinws.com",

          "password": "Password123!"

        }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.body

        if (data && data.access_token) {
          bru.setCookie({
            name: 'access_token',
            value: data.access_token
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

