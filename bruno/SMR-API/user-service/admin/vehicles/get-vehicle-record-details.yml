info:
  name: get-vehicle-record-details
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:4000/api/v1/admin/vehicles/:recordId
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: x-frontend-key
      value: "{{FRONTEND_KEY}}"
  params:
    - name: recordId
      value:
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
