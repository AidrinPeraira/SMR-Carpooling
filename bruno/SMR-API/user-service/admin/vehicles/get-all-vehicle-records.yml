info:
  name: get-all-vehicle-records
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:4000/api/v1/admin/vehicles
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: x-frontend-key
      value: "{{FRONTEND_KEY}}"
  params:
    - name: page
      value: 1
      type: query
    - name: limit
      value: 10
      type: query
    - name: search
      value:
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
