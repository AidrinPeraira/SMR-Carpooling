docs: |
  ## Admin — Get Journey Details

  Returns the full journey details including all passengers, their pickup/drop-off
  locations, statuses, and intermediate stops. The journeyId always matches the tripId.

  ### Path Parameters

  | Parameter   | Type   | Required | Description                                  |
  |-------------|--------|----------|----------------------------------------------|
  | `journeyId` | string | Yes      | The journey ID (same as the trip ID)         |

