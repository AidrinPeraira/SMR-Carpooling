info:
  name: get-driver-vehicles
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:4000/api/v1/vehicles
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: x-frontend-key
      value: "{{FRONTEND_KEY}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
