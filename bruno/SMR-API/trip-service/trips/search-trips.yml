info:
  name: search-trips
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:4000/api/v1/trips/search
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: x-frontend-key
      value: "{{FRONTEND_KEY}}"
  body:
    type: json
    data: |2-
        {
          "origin": {
            "stop_lat": 9.9312,
            "stop_lng": 76.2673,
            "stop_name": "Kochi",
            "stop_address": "Kochi, Kerala, India"
          },
          "destination": {
            "stop_lat": 8.5241,
            "stop_lng": 76.9366,
            "stop_name": "Trivandrum",
            "stop_address": "Trivandrum, Kerala, India"
          },
          "time": "2026-08-15T00:00:00.000Z",
          "query": {
            "page": 1,
            "limit": 10
          }
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
